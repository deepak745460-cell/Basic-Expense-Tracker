<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Expense Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 24px; font-size: 1.8rem; }

        /* ── Grid Layout ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full    { grid-column: span 2; }

        /* ── Card ── */
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 1rem; color: #555; margin-bottom: 16px; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }

        /* ── Form ── */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #555; }
        input, select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; transition: border 0.2s; }
        input:focus, select:focus { outline: none; border-color: #3498db; }

        /* ── Buttons ── */
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-blue   { background: #3498db; color: white; }
        .btn-green  { background: #2ecc71; color: white; }
        .btn-red    { background: #e74c3c; color: white; width: auto; padding: 4px 12px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer; }
        .btn-red:hover { opacity: 0.8; }

        /* ── Stats Bar ── */
        .stats-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 120px; background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-box .label { font-size: 0.78rem; color: #888; margin-bottom: 4px; }
        .stat-box .value { font-size: 1.4rem; font-weight: 700; color: #2c3e50; }
        .stat-box.danger .value { color: #e74c3c; }
        .stat-box.warning .value { color: #f39c12; }

        /* ── Budget Alert Banner ── */
        #alertBanner { display: none; background: #fff3cd; border-left: 4px solid #f39c12; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; color: #856404; }
        #alertBanner.overspent { background: #fde8e8; border-left-color: #e74c3c; color: #c0392b; }

        /* ── Progress Bar ── */
        .progress-wrap { background: #eee; border-radius: 99px; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 99px; background: #2ecc71; transition: width 0.4s, background 0.4s; }
        .progress-fill.warning { background: #f39c12; }
        .progress-fill.danger  { background: #e74c3c; }

        /* ── Filter/Search Bar ── */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { flex: 1; min-width: 140px; }
        .filter-bar .btn { width: auto; padding: 9px 18px; flex-shrink: 0; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.78rem; font-weight: 600; background: #eaf4fb; color: #2980b9; }
        .empty-msg { text-align: center; color: #aaa; padding: 30px; font-size: 0.9rem; }

        /* ── Category Summary ── */
        .cat-list { display: flex; flex-direction: column; gap: 10px; }
        .cat-row { display: flex; align-items: center; gap: 10px; }
        .cat-row .cat-name { width: 110px; font-size: 0.88rem; font-weight: 600; flex-shrink: 0; }
        .cat-row .cat-bar-wrap { flex: 1; background: #eee; border-radius: 99px; height: 8px; overflow: hidden; }
        .cat-row .cat-bar { height: 100%; border-radius: 99px; background: #3498db; }
        .cat-row .cat-amt { font-size: 0.85rem; font-weight: 700; color: #2c3e50; width: 70px; text-align: right; flex-shrink: 0; }

        @media(max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
            .stats-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💰 Personal Expense Tracker</h1>

    <!-- ── Alert Banner ── -->
    <div id="alertBanner">⚠️ Alert: <span id="alertMsg"></span></div>

    <!-- ── Stats Bar ── -->
    <div class="stats-bar">
        <div class="stat-box" id="statBudget">
            <div class="label">Monthly Budget</div>
            <div class="value">₹<span id="vBudget">0</span></div>
        </div>
        <div class="stat-box" id="statSpent">
            <div class="label">Total Spent</div>
            <div class="value">₹<span id="vSpent">0</span></div>
        </div>
        <div class="stat-box" id="statRemaining">
            <div class="label">Remaining</div>
            <div class="value">₹<span id="vRemaining">0</span></div>
        </div>
        <div class="stat-box" id="statPct">
            <div class="label">Budget Used</div>
            <div class="value"><span id="vPct">0</span>%</div>
        </div>
    </div>

    <!-- ── Progress Bar ── -->
    <div class="card" style="margin-bottom:20px; padding: 14px 20px;">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#888; margin-bottom:6px;">
            <span>Budget Progress</span>
            <span id="progLabel">0% used</span>
        </div>
        <div class="progress-wrap">
            <div class="progress-fill" id="progressBar" style="width:0%"></div>
        </div>
    </div>

    <div class="grid-2">
        <!-- ── Set Budget ── -->
        <div class="card">
            <h2>📋 Set Monthly Budget</h2>
            <div class="form-group">
                <label>Budget Amount (₹)</label>
                <input type="number" id="budgetInput" placeholder="e.g. 10000" min="0">
            </div>
            <button class="btn btn-green" onclick="setBudget()">Update Budget</button>
        </div>

        <!-- ── Add Expense ── -->
        <div class="card">
            <h2>➕ Add New Expense</h2>
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="amountInput" placeholder="e.g. 500" min="0">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="categoryInput">
                    <option value="Food">🍔 Food</option>
                    <option value="Rent">🏠 Rent</option>
                    <option value="Travel">🚌 Travel</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Health">💊 Health</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-group">
                <label>Note (optional)</label>
                <input type="text" id="noteInput" placeholder="e.g. Lunch at restaurant">
            </div>
            <button class="btn btn-blue" onclick="addExpense()">Add Expense</button>
        </div>

        <!-- ── Category Summary ── -->
        <div class="card">
            <h2>📊 Category-wise Summary</h2>
            <div class="cat-list" id="catSummary">
                <div class="empty-msg">No data yet</div>
            </div>
        </div>

        <!-- ── Expense List ── -->
        <div class="card full">
            <h2>📜 Expense Log</h2>

            <!-- Filter + Search Bar -->
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search by category or note..." oninput="fetchDashboard()">
                <select id="filterCat" onchange="fetchDashboard()">
                    <option value="">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Travel">Travel</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
                <button class="btn btn-blue" onclick="fetchDashboard()" style="width:auto; padding:9px 16px;">Apply</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Category</th>
                        <th>Amount (₹)</th>
                        <th>Date</th>
                        <th>Note</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <tr><td colspan="6" class="empty-msg">No expenses yet</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080';

    // Set today's date on page load
    window.onload = () => {
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        fetchDashboard();
    };

    // ── Dashboard Fetch (with Filter + Search support) ──────────────────
    async function fetchDashboard() {
        const search   = document.getElementById('searchInput').value.trim();
        const category = document.getElementById('filterCat').value;

        let url = `${API}/dashboard`;
        const params = [];
        if (search)   params.push(`search=${encodeURIComponent(search)}`);
        if (category) params.push(`category=${encodeURIComponent(category)}`);
        if (params.length) url += '?' + params.join('&');

        try {
            const data = await fetch(url).then(r => r.json());

            // ── Stats Update ──
            const budget    = data.budget || 0;
            const spent     = data.total_spent || 0;
            const remaining = budget - spent;
            const pct       = data.budget_used_pct || 0;

            document.getElementById('vBudget').textContent    = budget.toFixed(0);
            document.getElementById('vSpent').textContent     = spent.toFixed(0);
            document.getElementById('vRemaining').textContent = remaining.toFixed(0);
            document.getElementById('vPct').textContent       = pct.toFixed(1);

            // Remaining card color
            document.getElementById('statRemaining').className =
                'stat-box' + (remaining < 0 ? ' danger' : remaining < budget * 0.2 ? ' warning' : '');

            // ── Progress Bar ──
            const clampedPct = Math.min(pct, 100);
            const bar = document.getElementById('progressBar');
            bar.style.width = clampedPct + '%';
            bar.className   = 'progress-fill' + (pct >= 100 ? ' danger' : pct >= 80 ? ' warning' : '');
            document.getElementById('progLabel').textContent = pct.toFixed(1) + '% used';

            // ── Budget Alert Banner ──
            const banner = document.getElementById('alertBanner');
            if (budget > 0 && pct >= 100) {
                banner.style.display = 'block';
                banner.className = 'overspent';
                document.getElementById('alertMsg').textContent =
                    `Budget exceeded! You have overspent by ₹${Math.abs(remaining).toFixed(0)}.`;
            } else if (data.budget_alert) {
                banner.style.display = 'block';
                banner.className = '';
                document.getElementById('alertMsg').textContent =
                    `⚠️ You have used ${pct.toFixed(1)}% of your budget. Spend wisely!`;
            } else {
                banner.style.display = 'none';
            }

            // ── Expense Table ──
            const tbody = document.getElementById('expenseTableBody');
            const exps  = data.expenses || [];
            if (exps.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No expenses found</td></tr>`;
            } else {
                tbody.innerHTML = exps.map(e => `
                    <tr>
                        <td style="color:#aaa;font-size:0.8rem">#${e.id}</td>
                        <td><span class="badge">${e.category}</span></td>
                        <td><strong>₹${Number(e.amount).toFixed(2)}</strong></td>
                        <td style="color:#888;font-size:0.85rem">${e.date || '—'}</td>
                        <td style="color:#666;font-size:0.85rem">${e.note || '—'}</td>
                        <td>
                            <button class="btn-red" onclick="deleteExpense(${e.id})">🗑 Delete</button>
                        </td>
                    </tr>`).join('');
            }

            // ── Category Summary ──
            const cats    = data.category_summary || [];
            const maxAmt  = cats.reduce((m, c) => Math.max(m, c.total), 1);
            const catDiv  = document.getElementById('catSummary');
            if (cats.length === 0) {
                catDiv.innerHTML = `<div class="empty-msg">No categories yet</div>`;
            } else {
                catDiv.innerHTML = cats.map(c => `
                    <div class="cat-row">
                        <div class="cat-name">${c.category}</div>
                        <div class="cat-bar-wrap">
                            <div class="cat-bar" style="width:${(c.total/maxAmt*100).toFixed(0)}%"></div>
                        </div>
                        <div class="cat-amt">₹${Number(c.total).toFixed(0)}</div>
                    </div>`).join('');
            }

        } catch(e) {
            console.error('Dashboard fetch failed:', e);
        }
    }

    // ── Set Budget ───────────────────────────────────────────────────────────
    async function setBudget() {
        const val = document.getElementById('budgetInput').value;
        if (!val || val <= 0) return alert('Please enter a valid budget amount');

        await fetch(`${API}/set-budget`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ budget: parseFloat(val) })
        });
        document.getElementById('budgetInput').value = '';
        fetchDashboard();
    }

    // ── Add Expense ──────────────────────────────────────────────────────────
    async function addExpense() {
        const amount   = document.getElementById('amountInput').value;
        const category = document.getElementById('categoryInput').value;
        const date     = document.getElementById('dateInput').value;
        const note     = document.getElementById('noteInput').value.trim();

        if (!amount || amount <= 0) return alert('Please enter a valid amount');

        await fetch(`${API}/add-expense`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: parseFloat(amount), category, date, note })
        });
        document.getElementById('amountInput').value = '';
        document.getElementById('noteInput').value   = '';
        fetchDashboard();
    }

    // ── Delete Expense ───────────────────────────────────────────────────────
    async function deleteExpense(id) {
        if (!confirm(`Are you sure you want to delete Expense #${id}?`)) return;

        await fetch(`${API}/delete-expense`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        fetchDashboard();
    }
</script>
</body>
</html>
